<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseWire AI 情報中心</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div><b>PulseWire</b><span> AI MEDIA INTELLIGENCE</span></div><div class="live">● LIVE <span id="clock"></span></div></header>
<main><section class="hero"><div><small>REAL-TIME INTELLIGENCE</small><h1>全球即時輿情雷達</h1><p>國內外新聞高速蒐集、搜尋與事件監控 Demo</p></div><div class="status">Collector <b>5s</b><br><span>高頻輪詢模式</span></div></section>
<section class="stats"><article><label>24H 新聞</label><strong id="total">—</strong></article><article><label>過去 5 分鐘</label><strong id="recent">—</strong></article><article><label>新聞來源</label><strong id="sources">—</strong></article><article><label>更新頻率</label><strong>5 sec</strong></article></section>
<section class="toolbar"><input id="q" placeholder="搜尋公司、人物、事件、關鍵字…"><select id="region"><option value="all">全球</option><option>國內</option><option>國外</option></select><button onclick="load()">搜尋</button></section>
<div class="layout"><aside><h3>情報篩選</h3><button class="filter active" onclick="setRegion('all',this)">全部情報</button><button class="filter" onclick="setRegion('國內',this)">🇹🇼 國內</button><button class="filter" onclick="setRegion('國外',this)">🌐 國際</button><hr><h3>主題追蹤</h3><p class="muted">V1 已預留 Topic / Sentiment 欄位。下一版加入 AI 自動分類、事件聚類與警報。</p></aside><section><div class="sectionhead"><h2>最新情報</h2><span id="last">等待資料</span></div><div id="feed"></div></section></div></main>
<script>
const esc=s=>{let d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
function setRegion(v,b){document.querySelector('#region').value=v;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}
async function load(){let q=encodeURIComponent(document.querySelector('#q').value),r=encodeURIComponent(document.querySelector('#region').value);let a=await fetch(`/api/articles?q=${q}&region=${r}`).then(x=>x.json());document.querySelector('#feed').innerHTML=a.length?a.map(x=>`<article class="news"><div class="meta"><span>${esc(x.region)}</span><b>${esc(x.source)}</b><time>${esc(x.discovered_at||'')}</time></div><a href="${esc(x.url)}" target="_blank" rel="noopener"><h3>${esc(x.title)}</h3></a><p>${esc((x.summary||'').replace(/<[^>]+>/g,'').slice(0,220))}</p><div class="tags"><i>${esc(x.topic)}</i><i>${esc(x.sentiment)}</i></div></article>`).join(''):'<div class="empty">尚無資料。啟動 collector 後，新新聞會出現在這裡。</div>';document.querySelector('#last').textContent='最後刷新 '+new Date().toLocaleTimeString()}
async function stats(){let s=await fetch('/api/stats').then(x=>x.json());total.textContent=s.total;recent.textContent='+'+s.recent;sources.textContent=s.sources}
setInterval(()=>{clock.textContent=new Date().toLocaleTimeString()},1000);setInterval(()=>{load();stats()},5000);load();stats();
</script></body></html>
